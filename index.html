<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Ladder Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Helvetica,Arial,sans-serif;
}

/* BODY */

body{
background:linear-gradient(180deg,#000,#0b0b0b,#000);
color:white;
text-align:center;
overflow-x:hidden;
}

/* HERO */

header{
height:85vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
position:relative;
}

/* LOGO */

.logo{
max-width:320px;
width:80%;
margin-bottom:30px;
position:relative;
z-index:5;
}

/* CLOUD */

.hero-cloud{
position:absolute;
top:45%;
left:50%;
width:600px;
height:240px;
background:white;
border-radius:50%;
filter:blur(50px);
transform:translate(-50%,-50%);
z-index:1;
}

/* HERO TEXT */

.hero-text{
font-size:1.4rem;
max-width:700px;
font-weight:bold;
line-height:1.6;

text-shadow:
-1px -1px 0 black,
1px -1px 0 black,
-1px 1px 0 black,
1px 1px 0 black;

z-index:5;
}

/* NAVIGATION */

nav{
margin-top:40px;
}

nav a{

display:inline-block;
margin:10px;

padding:12px 22px;

color:white;
text-decoration:none;

border:1px solid white;
border-radius:6px;

font-weight:600;

transition:0.3s;
}

nav a:hover{
background:white;
color:black;
}

/* FOOTER */

footer{
margin-top:80px;
padding:30px;
color:#777;
font-size:0.9rem;
}

</style>
</head>

<body>

<header>

<div class="hero-cloud"></div>

<img src="Ladder Records logo 2a.jpg" class="logo">

<div class="hero-text">
A CREATIVE STUDIO, LABEL & ARTIST COLLECTIVE<br>
WE CAN GET YOU TO THE NEXT RUNG OF THE LADDER
</div>

</header>

<nav>

<a href="index.html">Home</a>
<a href="studio.html">Studio</a>
<a href="gallery.html">Gallery</a>
<a href="booking.html">Booking</a>

</nav>

<footer>

© Ladder Records 2026

</footer>

</body>
</html>
